name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face via Git
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Configure a temporary git user
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # 2. Add your Hugging Face Space as a remote destination
          # Replace 'YOUR_HF_USERNAME' and 'YOUR_SPACE_NAME' with your actual HF details
          git remote add hf https://x-token:${HF_TOKEN}@huggingface.co/spaces/raghul-169/risk-analyzer
          
          # 3. Force-push the main branch to Hugging Face
          git push -f hf main
