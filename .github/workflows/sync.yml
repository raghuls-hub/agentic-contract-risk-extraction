name: Sync to Hugging Face Hub

on:
  push:
    branches: [main] # Triggers every time you push to the main branch

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: raghul-169/risk-analyzer # Change this to your exact HF details
          hf_token: ${{ secrets.HF_TOKEN }}
          space_sdk: docker # Forces it to deploy as your custom backend container
