name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Hugging Face CLI
        run: |
          pip install huggingface_hub

      - name: Clean up temporary PDFs locally
        run: |
          # Remove the PDFs so we don't upload unnecessary clutter
          rm -rf input_documents/
          rm -rf frontend/

      - name: Upload to Hugging Face via API
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Use the CLI to upload the current folder directory directly to your Space
          # This completely bypasses Git pre-receive binary hooks!
          huggingface-cli upload-folder \
            --repo-type=space \
            --token=$HF_TOKEN \
            raghul-169/risk-analyzer \
            . \
            . \
            --exclude ".git/*" ".github/*"
