name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face via Git
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Configure a temporary git user
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # 2. Remove the binary files from the local tracking context
          # This deletes the folder and tells Git to forget about it for this push
          rm -rf input_documents/
          git rm -r --cached input_documents/ --ignore-unmatch
          git commit -m "chore: clear binaries for HF sync" --allow-empty
          
          # 3. Add your Hugging Face Space as a remote destination
          git remote add hf https://x-token:${HF_TOKEN}@huggingface.co/spaces/raghul-169/risk-analyzer
          
          # 4. Force-push the stripped branch to Hugging Face
          git push -f hf main
